<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Appoios">
  <!--
    A house roofed by a leaf.

    Dropped the letterform approach: an A whose crossbar was a leaf kept reading as
    an eye at every size, and nudging the geometry did not fix what was wrong with
    the idea. A house under a leaf says home and green in one glance, with no
    letter to decode — which is what a logo has to do in the half-second someone
    spends on a browser tab or a home screen.
  -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8a5e"/>
      <stop offset="1" stop-color="#1c5c3f"/>
    </linearGradient>
    <linearGradient id="folha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bef264"/>
      <stop offset="1" stop-color="#6ee7a8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fundo)"/>

  <!-- The leaf, doubling as the roof. Pointed apex so it is a leaf and not a dome;
       overhangs the walls on both sides so it is a roof and not a balloon. The tip
       leans right rather than sitting dead centre: a leaf grows off a stem at an
       angle, and the asymmetry is what stops the shape reading as a tent. -->
  <path d="M110 278 C118 200 168 132 300 92 C352 138 386 200 402 278 Z"
        fill="url(#folha)"/>
  <path d="M296 112 C262 160 240 216 234 274" fill="none" stroke="#1c5c3f"
        stroke-width="11" stroke-linecap="round" opacity="0.3"/>

  <!-- The house. Flat top tucked under the leaf, so the two read as one object. -->
  <path d="M158 278 h196 v104 a22 22 0 0 1 -22 22 H180 a22 22 0 0 1 -22 -22 Z"
        fill="#ffffff"/>
  <path d="M232 404 v-52 a24 24 0 0 1 48 0 v52 Z" fill="#1c5c3f" opacity="0.85"/>
</svg>
