name: CI

# Everything here must pass with no network access at all, so CI and the
# egress-blocked development sandbox behave identically. Extraction runs against
# recorded cassettes and a missing cassette is a hard failure, never a silent
# (and billable) call to the API.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ANTHROPIC_MODE: replay

    steps:
      - uses: actions/checkout@v4

      # No `version:` on purpose. The version lives in `packageManager` in the root
      # package.json, which Vercel also reads — and pnpm/action-setup fails outright
      # if both declare one. One authority, so CI and the deploy cannot drift apart.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test
