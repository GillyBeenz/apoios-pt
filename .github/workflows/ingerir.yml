name: Ingerir apoios

# Ingestion only. No personal data reaches this runner, and that is a deliberate
# structural boundary rather than a convention: this repository is public, so its
# Actions logs are public too. Alert matching reads subscriber emails and their
# home-improvement interests, so it runs inside Supabase on pg_cron where the logs
# are private. The credential below is a restricted Postgres role with no grants on
# profiles, subscriptions, alerts_sent or auth.* — a stray query against a user
# table fails loudly here instead of quietly publishing personal data.

on:
  workflow_dispatch:
  schedule:
    # Daily at 05:30 UTC. Deliberately not on the hour: GitHub delays top-of-hour
    # scheduled runs most.
    - cron: "30 5 * * *"

permissions:
  contents: read
  issues: write

jobs:
  ingerir:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODE: live
      # A direct Postgres connection as the `apoios_ingest` role.
      #
      # This replaced a PostgREST client and three separate Supabase credentials.
      # PostgREST takes the role from a JWT claim, and will only trust a signature
      # it can verify against the project's key set — which is asymmetric. An
      # HS256 token signed with a shared secret has no matching key there and is
      # refused with PGRST301, whatever secret signs it, and Supabase does not
      # hand out the private half of an asymmetric key. So there was no token this
      # workflow could mint that PostgREST would accept for a custom role.
      #
      # Connecting as the role itself has no such problem, and the boundary gets
      # stronger rather than weaker: the restriction is enforced against the
      # connection by the database, not against a claim inside a token. The role
      # holds grants on nine tables and none on profiles, subscriptions,
      # alerts_sent, alerts_outbox, unsubscribe_tokens or anything in auth, so a
      # stray query against a user table fails loudly here instead of quietly
      # printing somebody's email into a public build log.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      # No `version:` on purpose. The version lives in `packageManager` in the root
      # package.json, which Vercel also reads — and pnpm/action-setup fails outright
      # if both declare one. One authority, so CI and the deploy cannot drift apart.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Executar pipeline
        run: pnpm ingerir

      # A failing job is the operator's first alarm: GitHub emails the repository
      # owner on workflow failure at no cost. The independent watchdog that catches
      # this job *not running at all* lives in Supabase, on separate infrastructure,
      # because a check inside the job cannot detect the job never firing.
      - name: Abrir issue se a ingestão falhou
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = "Ingestão de apoios falhou";
            const { data: existentes } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "ingestao",
            });
            const jaAberta = existentes.find((i) => i.title === titulo);
            const corpo = `A execução [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) falhou.`;
            if (jaAberta) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: jaAberta.number,
                body: corpo,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titulo,
                body: corpo,
                labels: ["ingestao"],
              });
            }
